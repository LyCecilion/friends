name: 申请友链
description: 申请加入 CrystaRin 的友链页面。
labels:
  - 审核中
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 申请确认
      description: 提交前请确认以下事项。仓库所有者提交的申请会自动通过，其他申请需要人工审核。
      options:
        - label: 我确认站点内容安全合规，并同意合理控制对本站及订阅源的访问频率。
          required: true

  - type: textarea
    id: json-data
    attributes:
      label: 友链信息
      description: 请在双引号中填写，不要修改 JSON 格式。icon、description 和 feed 可以留空，审核时会尝试从站点元数据中补全。
      value: |
        <!--
        请在下方的 `JSON` 块中填写。字段说明：
        - title：友链标题
        - url：站点地址
        - icon：网站图标
        - description：一句话简介
        - feed：订阅地址，用于抓取并显示最新文章；没有订阅地址时可以留空
        -->

        ```json
        {
            "title": "",
            "url": "",
            "icon": "",
            "description": "",
            "feed": ""
        }
        ```
    validations:
      required: true

  - type: input
    id: friends-html
    attributes:
      label: 友链页面地址
      description: 用于人工审核和自动检测。不必提前添加本站，审核通过后再添加即可。
      placeholder: 例如：https://crystal.stellalyr.ink/social/
    validations:
      required: true

  - type: input
    id: friends-repo
    attributes:
      label: 友链仓库（可选）
      description: 如果你也使用 GitHub Issues 管理友链，可以附上仓库地址，零音会前往申请。
      placeholder: 例如：https://github.com/LyCecilion/friends/
