name: Generate Friend Data

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: friends-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v4

      - name: Generate v2/data.json
        run: python scripts/generate_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish output branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B output
          git add --all
          git commit -m 'Update friend data' || exit 0
          git push --force origin output
