name: Sync Friend Data

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: sync-friend-data
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      issues: read
    uses: ./.github/workflows/generate-data.yml
