name: Update Feed Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  parse-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v4

      - name: Parse feed posts
        run: python scripts/update_feeds.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate:
    needs: parse-feeds
    permissions:
      contents: write
      issues: read
    uses: ./.github/workflows/generate-data.yml
